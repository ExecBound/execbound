# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "execbound-connectors"
version = "0.1.0"
description = "ExecBound's provider connectors and the mock vendors its tests and demos run"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Only the Python versions CI runs are claimed; widen this when a CI leg tests an older one.
requires-python = ">=3.13"
dependencies = ["execbound-protocol", "httpx>=0.28,<1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.optional-dependencies]
# The mock vendor servers only; a connector itself needs no web framework.
mock = ["fastapi>=0.141,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/execbound_connectors"]

[tool.hatch.build.targets.sdist]
include = ["src/execbound_connectors", "README.md", "pyproject.toml", "LICENSE"]
